<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Nuevo Pago</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <h1>Registrar Nuevo Pago</h1>

    <form id="formPago">
        <label for="inpNombre">Nombre del servicio</label>
        <input type="text" id="inpNombre" placeholder="Ej: AWS Nube Proyecto Final">
        
        <label for="inpCosto">Costo mensual</label>
        <input type="number" id="inpCosto" step="0.01" min="0" placeholder="Ej: 21.90">

        <label for="inpFecha">Fecha del pago</label>
        <input type="date" id="inpFecha">

        <label for="inpUrl">URL para cancelar</label>
        <input type="url" id="inpUrl" placeholder="https://...">

        <p id="msjError"></p>

        <button type="submit" class="boton">Guardar</button>
    </form>

    <a href="index.html">Volver a la lista</a>

    <script src="js/almacen.js"></script>
    <script src="js/registro.js"></script>
</body>
</html>
