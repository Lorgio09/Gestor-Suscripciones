<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Suscripciones</title>
    <!-- Enlaces CDN de Bootstrap y sus íconos (¡Esto es lo que le da el diseño!) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row mb-4 align-items-center">
            <div class="col">
                <h1 class="text-secondary border-bottom pb-2">Mis Suscripciones</h1>
            </div>
            <div class="col-auto">
                <a href="registro.html" class="btn btn-primary shadow-sm">
                    <i class="bi bi-plus-circle me-1"></i> Registrar Nuevo Pago
                </a>
            </div>
        </div>
        
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light text-secondary">
                        <tr>
                            <th class="ps-4 border-0">Servicio</th>
                            <th class="border-0">Costo</th>
                            <th class="border-0">Próximo Cobro</th>
                            <th class="text-end pe-4 border-0">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCuerpo">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/almacen.js"></script>
    <script src="js/lista.js"></script>
</body>
</html>
